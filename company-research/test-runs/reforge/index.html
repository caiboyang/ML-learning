capital", "rf-p-pay", "rf-p-outcome", "rf-p-retention", "rf-p-team", "rf-p-supply", "rf-p-tools", "rf-p-capital", "rf-p-learning-now"], "thesis": "Reforge 证明了从业者愿为高阶 cohort 付高价，但没有证明年费会员能留住人，也没有证明 AI 工具能单独收费。", "conclusion": "下一步最有价值的证据是 2021–2024 年的续费数据；进入『数据核验』专题看收入序列、早期漏斗与判断更新。", "evidenceIds": ["e-chargebee", "e-balfour-21m", "e-joining-miro"]}, {"id": "company-status", "title": "现状（2026）", "part": "assets", "overviewIds": ["rf-status"], "thesis": "Reforge 只剩学习品牌在独立运营，且其母公司 Miro 本身正被 Bending Spoons 收购，学习业务的前景比收购公告所说的更不确定。", "conclusion": "研究现状时以『被保留的附属品牌』看待 Reforge Learning；交割后需要复查。", "evidenceIds": ["e-joining-miro", "e-bending-spoons"]}, {"id": "product-map", "title": "产品盘点", "part": "assets", "overviewIds": ["rf-products"], "thesis": "Reforge 的收费核心始终是年费会员与团队席位，内容库与 AI 工具都是为了解决『学了用不上、用完就走』。", "conclusion": "评价各产品时要分开收费、留存与战略价值三种作用；只有收费作用有公开证据。", "evidenceIds": ["e-pricing", "e-teams-2023", "e-changes-2023"]}, {"id": "channel-map", "title": "渠道盘点", "part": "assets", "overviewIds": ["rf-channels"], "thesis": "早期获客几乎完全来自少数操盘手的个人信誉与写作，雇主预算负责付款；这让起步便宜，也让增长受专家供给与预算周期约束。", "conclusion": "借鉴者若没有可调用的个人信誉渠道，就不能复制 Reforge 的低成本获客。", "evidenceIds": ["e-muas", "e-expense"]}, {"id": "asset-map", "title": "起步资产", "part": "assets", "overviewIds": ["rf-assets"], "thesis": "高价小批次能成立，靠的是信誉、受众、筛选与专家网络四项资产同时到位，缺任何一项都难成立。", "conclusion": "比较对标时先比这四项资产，而不是比课程形式。", "evidenceIds": ["e-muas", "e-amplitude-2016"]}, {"id": "team-map", "title": "团队与分工", "part": "assets", "overviewIds": ["rf-team"], "thesis": "Reforge 的关键供给来自兼职的外部专家而非全职员工，转型期又靠收购补创业型人才，团队规模在 2024 年后降到几十人。", "conclusion": "外部专家的分成与投入是理解单位经济的关键缺口。", "evidenceIds": ["e-raise-21m", "e-chargebee", "e-promptled"]}, {"id": "economics", "title": "收入与资本", "part": "assets", "overviewIds": ["rf-economics", "rf-series-revenue"], "thesis": "价格结构清楚，但决定盈利的续费率、讲师分成与获客成本都不透明，且收入只有两个自述数值。", "conclusion": "单位经济只能做情景分析；不能据此判断 Reforge 是否赚钱。", "evidenceIds": ["e-pricing", "e-chargebee"]}, {"id": "own-origin", "title": "自身路径", "part": "assets", "overviewIds": ["rf-origin-summary", "rf-s1", "rf-s2", "rf-s3", "rf-s4", "rf-s5", "rf-s6", "rf-s7"], "thesis": "Reforge 先用最少资本证明高价付费，再用资本扩目录；2022 年后的每一步都在处理同一个问题：需求是阶段性的。", "conclusion": "最值得借鉴的是前两步；后五步更多是警示。四模块拆解见『自身路径分析』专题。", "evidenceIds": ["e-muas", "e-chargebee"]}, {"id": "own-growth", "title": "自身回路", "part": "assets", "overviewIds": ["rf-loop"], "thesis": "获客回路（内容→申请→口碑→团队采购）有信号，留存回路（扩题→续费、工具→高频）没有闭合。", "conclusion": "Reforge 是强获客、弱留存的流程，不是已成立的飞轮。", "evidenceIds": ["e-muas", "e-chargebee"]}, {"id": "historical-choices", "title": "关键决策", "part": "decisions", "overviewIds": ["rf-d1", "rf-d2", "rf-d3", "rf-d4", "rf-d5"], "thesis": "五个关键选择中，起步方式与融资扩题决定了后来的成本结构；之后三次调整都在补救需求节奏问题。", "conclusion": "复盘只能区分当时可知与事后结果，管理层的真实备选大多未知。", "evidenceIds": ["e-balfour-21m", "e-teams-2023", "e-joining-miro"]}, {"id": "decline-diagnosis", "title": "收缩诊断", "part": "decisions", "overviewIds": ["rf-decline"], "thesis": "在『2022 年后需求收缩是行业普遍现象』的前提下，宏观是触发、阶段性需求是放大，竞争替代证据最弱。", "conclusion": "续费数据能直接改写排序；拿不到时保持暂定，不估算贡献比例。", "evidenceIds": ["e-layoff-2022", "e-chargebee"]}, {"id": "transfer-order", "title": "借鉴顺序", "part": "choices", "overviewIds": ["rf-transfer"], "thesis": "Reforge 最可迁移的是起步验证法，最不该照搬的是融资后扩题与年费会员假设。", "conclusion": "分类以读者已有写作受众或专家关系为前提；用途确认后会重排。", "evidenceIds": ["e-muas", "e-chargebee"]}, {"id": "next-investigation", "title": "下一步调查", "part": "validation", "overviewIds": ["rf-investigation", "rf-question", "rf-contract"], "thesis": "目前最大的未知是续费与会员规模；有了它才能区分『需求阶段性』与『竞争分流』哪个更重要。", "conclusion": "拿不到内部数据时保留缺口与代理证据的边界；用户回答后改写借鉴顺序与诊断。", "evidenceIds": ["e-chargebee", "e-supra"]}, {"id": "featured-benchmark", "title": "重点案例：Lenny", "part": "paths", "overviewIds": ["lenny-verdict", "lenny-assets", "lenny-s1", "lenny-s2", "lenny-s3", "lenny-s4", "lenny-s5", "lenny-s6", "lenny-tradeoff", "lenny-loop", "lenny-transfer"], "thesis": "Lenny 与 Reforge 起点资产最接近（操盘手写作受众），却选了低价订阅与免费播客，正好用来检验『阶段性需求』是否可以靠低价高频绕开。", "conclusion": "选 Lenny 而不选 Maven 作为重点，是因为它与 Reforge 的起点相同、收费结构相反；这不证明低价订阅更好，只说明它避开了 Reforge 的流失原因。", "evidenceIds": ["e-lenny-2020", "e-lenny-fr"]}, {"id": "peer-comparison", "title": "横向对照", "part": "paths", "overviewIds": ["rf-comparison"], "thesis": "四家面对同一批在职学习者，差别在谁承担内容成本、谁付款、需求是否高频。", "conclusion": "Maven 与 Section 的逐家拆解见『横向对照详解』专题；它们分别检验平台化与转企业两条路线。", "evidenceIds": ["e-maven-a16z", "e-section-tc"]}], "topics": [{"id": "audit", "title": "数据核验", "parentSectionId": "executive-summary", "verdictId": "rf-verdict", "argument": ["口径与自报边界", "收入与项目序列", "早期漏斗", "证明状态", "判断更新"], "modules": [{"id": "audit-scope", "title": "01 口径与自报边界", "thesis": "三个首屏数字分别是自述收入、累计学员与融资额，没有一个能说明当前经营状况。", "conclusion": "不能把累计学员当会员，也不能把融资当收入。", "recordIds": ["rf-m-revenue", "rf-m-alumni", "rf-m-capital"]}, {"id": "audit-series", "title": "02 收入与项目序列", "thesis": "收入只有两个数值点，项目数在 2022 年达到顶峰，二者同步上升但无法分辨新题贡献。", "conclusion": "2023 年后口径改变与缺失并存，不能画成连续趋势。", "recordIds": ["rf-series-revenue", "rf-series-programs"]}, {"id": "audit-funnel", "title": "03 早期漏斗", "thesis": "首期唯一可靠的数字是约 1,000 份申请，付款与完课都缺失。", "conclusion": "申请数只能证明兴趣，不能证明付款。", "recordIds": ["rf-funnel-first"]}, {"id": "audit-proof", "title": "04 证明状态", "thesis": "付费已证明，续费有反证，工具与资本回报未证明。", "conclusion": "下一轮优先补续费数据。", "recordIds": ["rf-p-pay", "rf-p-outcome", "rf-p-retention", "rf-p-team", "rf-p-supply", "rf-p-tools", "rf-p-capital", "rf-p-learning-now"]}, {"id": "audit-change", "title": "05 判断更新", "thesis": "研究过程中有三次判断变更，都来自新公开资料而非用户回答。", "conclusion": "变更已写入首屏、现状、诊断与借鉴顺序。", "recordIds": ["rf-change-status", "rf-change-maven", "rf-change-decline", "rf-contract"]}]}, {"id": "origin", "title": "自身路径分析", "parentSectionId": "own-origin", "verdictId": "rf-verdict", "argument": ["互补起点资产", "首次交易与交付", "取舍与反模式", "回路与迁移"], "modules": [{"id": "origin-assets", "title": "01 互补起点资产", "thesis": "信誉、受众、筛选与专家网络同时到位，使高价小批次在没有资本时成立。", "conclusion": "工程与企业销售是后补的，转型时成为瓶颈。", "recordIds": ["rf-assets", "rf-team"]}, {"id": "origin-validation", "title": "02 首次交易与交付验证", "thesis": "首期靠申请筛选与改版建立口碑，再用专家共建扩目录；付款细节未公开。", "conclusion": "首次交易的价格与人数是最大 nyId": "reforge", "section": "historical-choices", "kind": "inference", "role": "decision", "status": "复盘（研究者解释）", "title": "2015：做高价申请制 cohort，而不是免费内容或自学视频课", "text": "起步方式决定了此后的收入结构：高价、小批次、依赖专家时间。", "limitation": "『备选』除注明外均为研究者构造，不代表管理层讨论过；结果出现在选择之后不等于由选择导致。", "evidenceIds": ["e-muas", "e-chargebee", "e-spring-2025"], "relatedIds": ["rf-s1", "rf-s2"], "decision": {"period": "2015–2016", "context": "Balfour 在 HubSpot 任职，认为高阶从业者培训稀缺；手里有两人的博客受众。", "knownThen": "已知：两人博客有受众、市面培训偏入门（自述）。不知道：高价能否持续、需求是否连续。", "options": "实际：8 周 cohort、申请制。研究者构造：付费通讯、录播视频课、线下会议；无证据显示曾讨论。", "chosen": "SVBR Growth Series，申请筛选、小批次。", "outcome": "约 1,000 份申请；NPS 升到 72；自举约 4 年到 $10M（均为自述）。", "tradeoff": "高价与筛选限制规模；讲师时间是容量上限；没有日常使用场景。", "assessment": "在『受众已有、内容高阶、雇主可报销』三个条件下，这是低资本验证付费的有效方式；直接证据只有自述数字。", "falsifier": "若同期同类高阶课程不筛选、低价也取得同等付费与口碑，则『筛选＋高价』不是关键因素。"}}, {"id": "rf-d2", "companyId": "reforge", "section": "historical-choices", "kind": "inference", "role": "decision", "status": "复盘（研究者解释）", "title": "2021–2022：结束自举，融资 $81M 扩题", "text": "在盈利状态下选择用资本换速度，时点贴近教育赛道估值高点。", "limitation": "『备选』除注明外均为研究者构造，不代表管理层讨论过；结果出现在选择之后不等于由选择导致。", "evidenceIds": ["e-balfour-21m", "e-series-b", "e-fall-2022", "e-holoniq", "e-chargebee", "e-layoff-2022"], "relatedIds": ["rf-s4", "rf-p-capital"], "decision": {"period": "2021-02 至 2022-03", "context": "已 8 位数收入且盈利；想从每年少量新题扩到 30+ 题目，现金流不够（自述）。", "knownThen": "已知：疫情期线上学习热、2021 年全球 edtech 风投 $20.8B 创纪录。不知道：2022 年科技业裁员与预算收紧。", "options": "实际：A、B 两轮融资扩题、扩 EIR。研究者构造：继续自举、只深化增长与产品两个核心方向。", "chosen": "两轮共 $81M；项目扩到约 20 个、讲师 50+。", "outcome": "自述 18 个月内收入到约 $30M；随后 2022-11、2023-04 两轮裁员。", "tradeoff": "内容与人员成本前置；若需求阶段性，新题未必带来续费；资本方对增长速度的预期上升。", "assessment": "扩题在上行期带来收入增长，但把公司变得对需求下滑更敏感。不能据此断定融资导致收缩。", "falsifier": "若有数据显示 2022 年后的下滑主要来自原有核心课程而非新题目，扩题就不是主要拖累。"}}, {"id": "rf-d3", "companyId": "reforge", "section": "historical-choices", "kind": "inference", "role": "decision", "status": "复盘（研究者解释）", "title": "2023：从季节性 cohort 转向团队席位与常年内容", "text": "第一次正面处理『需要时才用』：把购买者换成团队，把价     const scope = caseCompany ? `${caseCompany.name} 案例专题` : `${topic ? `${topic.title}；` : '主报告；'}${company.value === 'all' ? '全部公司' : companies.get(company.value).name}＋全局记录`;
    byId('results').textContent = `范围：${scope}；${kind.value === 'all' ? '全部性质' : names[kind.value]}；搜索：${term || '无'}（${sourceSearch.checked ? '含关联来源' : '正文与公司名'}）。当前页匹配 ${visible.length} / ${caseIds.size} 条记录（非经营统计），其中仅来源命中 ${sourceOnly.size} 条。补充论证请进入对应专题搜索；首屏摘要不随正文筛选重算；覆盖清单与证据明细保持完整。`;
    byId('empty').hidden = visible.length > 0 || caseIds.size === 0; syncLayout(); updateActiveSection();
  }
  const narrow = window.matchMedia('(max-width:1000px)');
  function syncLayout() {
    const offset = narrow.matches ? 20 : 60 + byId('filters').offsetHeight + 24;
    document.documentElement.style.setProperty('--anchor-offset', `${offset}px`);
  }
  function updateActiveSection() {
    const line = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--anchor-offset')) + 2;
    const sections = [...document.querySelectorAll('main section')]; let active = sections[0];
    for (const section of sections) if (section.getBoundingClientRect().top <= line) active = section;
    for (const a of nav.querySelectorAll('a')) {
      if (a.hash === `#${active.id}`) a.setAttribute('aria-current','location'); else a.removeAttribute('aria-current');
    }
  }
  function revealHash() {
    let id; try { id = decodeURIComponent(location.hash.slice(1)); } catch { return; }
    const record = records.get(id);
    if (record && !byId(id)) {
      const inCurrentView = view() ? view().modules.some(m => m.recordIds.includes(id)) : sections.some(s => s.overviewIds.includes(id));
      if (!inCurrentView) {
        const destination = sections.some(s => s.overviewIds.includes(id)) ? null : detailViews.find(v => v.data.modules.some(m => m.recordIds.includes(id)));
        caseCompany = destination?.company || null; topic = destination?.topic || null;
        const url = new URL(location.href); url.search = destination?.query || ''; history.replaceState(null,'',url);
      }
      company.value = record.companyId || 'all'; search.value = ''; kind.value = 'all'; render();
    }
    const target = byId(id); if (target) { target.scrollIntoView({block:'start'}); target.focus({preventScroll:true}); }
  }
  byId('filters').addEventListener('submit', e => e.preventDefault());
  byId('filters').addEventListener('input', render);
  byId('filters').addEventListener('change', render);
  byId('filters').addEventListener('reset', e => { e.preventDefault(); company.value = caseCompany?.id || 'all'; kind.value = 'all'; search.value = ''; sourceSearch.checked = false; render(); });
  window.addEventListener('hashchange',revealHash);
  window.addEventListener('scroll',updateActiveSection,{passive:true}); window.addEventListener('resize',() => { syncLayout(); updateActiveSection(); });
  document.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (a && a.hash === location.hash) { e.preventDefault(); revealHash(); } });
  function syncDirectory() { byId('directory').open = !narrow.matches; }
  narrow.addEventListener('change',syncDirectory); syncDirectory(); render(); revealHash();
}
start().catch(error => { byId('notice').textContent = `页面未完成加载：${error.message} 请校验 JSON 与引用；直接打开时使用导出的单文件 HTML，多文件预览按 dashboard-data.md 启动静态服务。`; byId('notice').setAttribute('role','alert'); });
</script>
</body>
</html>
