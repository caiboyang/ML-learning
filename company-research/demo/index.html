<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公司研究工作台 · 模板</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="top"><strong>公司研究工作台</strong><span id="date">可复用页面模板</span></header>
  <aside>
    <details open id="directory"><summary>研究目录</summary><nav id="navigation" aria-label="研究章节"></nav></details>
    <p>证明状态 → 起步资产 → 对标路径 → 当前路线 → 验证与新证据</p>
  </aside>
  <main id="main" tabindex="-1">
    <header class="intro">
      <p class="eyebrow">RESEARCH → DECISION</p>
      <h1 id="title">公司研究页面起点</h1>
      <p id="question">正在读取同目录的 research.json。</p>
      <p id="scope"></p>
      <p id="summary-label" class="eyebrow"></p>
      <div id="hero-verdict" class="hero-verdict"></div>
      <p id="hero-boundary" class="limit"></p>
      <div id="hero-metrics" class="metric-row"></div>
      <div id="case-links" class="related"><a id="overview-link" href="./index.html" hidden>返回研究总览 →</a></div>
      <p class="notice" id="notice">示例仅用于展示方法，不代表任何真实公司的事实。</p>
    </header>
    <form id="filters" class="toolbar" role="search" aria-label="研究内容筛选">
      <label id="company-control">公司<select id="company"><option value="all">全部公司</option></select></label>
      <label class="search-label">搜索<input id="search" type="search" placeholder="公司、动作、指标…"></label>
      <label>内容性质<select id="kind"><option value="all">全部内容</option><option value="fact">事实记录</option><option value="inference">机制解释</option><option value="recommendation">行动建议</option></select></label>
      <label class="source-toggle"><input id="source-search" type="checkbox">包含关联来源</label>
      <button type="reset">重置筛选</button>
    </form>
    <p id="results" role="status" aria-live="polite"></p>
    <p id="empty" hidden>没有匹配记录。请修改搜索词或重置筛选。</p>
    <noscript><p class="notice">交互模板需要 JavaScript 读取数据。请查看同目录 research.json；正式交付若需无脚本阅读，应同时生成包含正文的静态 HTML。</p></noscript>
    <div id="content"></div>
    <section id="sources" tabindex="-1"><h2>证据明细</h2><p>来源明细完整保留，不随内容筛选隐藏。证据性质与支持边界始终可查。</p><div id="evidence-list"></div></section>
    <footer>问答由研究 Agent 处理；此页展示已记录的回答和判断变化，不收集或保存输入。</footer>
  </main>
</body>
</html>
